//file:noinspection GradlePackageUpdate
plugins {
    id('java')
    id('java-library-distribution')
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.slf4j:slf4j-nop:2.0.18'
    implementation 'com.github.davidmoten:subethasmtp:7.2.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'
    implementation 'jakarta.mail:jakarta.mail-api:2.1.5'
    implementation 'io.github.hakky54:ayza-for-pem:10.1.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'eu.tneitzel:argparse4j:1.3.0'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'io.github.furstenheim:copy_down:1.1'
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

tasks.withType(JavaCompile).configureEach {
    // Build for the oldest supported Java, whatever JDK runs Gradle.
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all' << '-Werror'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
        showStandardStreams = false
    }
}